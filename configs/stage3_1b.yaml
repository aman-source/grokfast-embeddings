# Stage 3: 1B model, 10B tokens, two arms
# Quick sanity check: does the grokfast_emb effect survive at 1B scale?
#
# Single GPU:
#   python src/train.py --config configs/stage3_1b.yaml --seeds 0 1
#
# Multiple GPUs (one seed per GPU):
#   CUDA_VISIBLE_DEVICES=0 python src/train.py --config configs/stage3_1b.yaml --seeds 0 --tag gpu0
#   CUDA_VISIBLE_DEVICES=1 python src/train.py --config configs/stage3_1b.yaml --seeds 1 --tag gpu1
#   python src/train.py --config configs/stage3_1b.yaml --report-only
#
# NOTE: tokens_total is set to 10B (Chinchilla-ish for 1B params).
# For a quick signal check, reduce to 2000000000 (2B).

stage: 2

# Architecture -- 18L/2048H/32A/5504FF ~1.01B unique params (tied embed/lm_head)
n_layers:   18
d_model:    2048
n_heads:    32
d_ff:       5504    # 2/3 * 4 * 2048 rounded to nearest mult of 128
seq_len:    1024
vocab_size: 50257

# Training -- scale LR down slightly for 1B (linear scaling heuristic)
lr:            1.5e-4
lr_min:        1.5e-5
beta1:         0.9
beta2:         0.95
weight_decay:  0.1
grad_clip:     1.0
batch_size:    64       # 64 * 1024 = 65536 tokens/step
grad_accum:    8        # micro_batch=8; 1B model needs headroom on activations
tokens_total:  10000000000   # 10B (Chinchilla-ish for 1B). Set to 2B for quick check.
warmup_steps:  2000
eval_interval: 5000
eval_batches:  50

# Grokfast
gf_alpha: 0.98
gf_lamb:  2.0

seeds: [0, 1]

arms:
  - name:     baseline
    beta1:    0.9
    grokfast: false

  - name:     grokfast_emb
    beta1:    0.9
    grokfast: true
    emb_only: true

# Paths -- reuse Stage 2 token cache if available (it's a superset)
# For 10B tokens you'll need a larger cache: set tokens_total appropriately
# in tokenize_and_cache (it reads tokens_total + 25M from FineWeb-Edu)
data_cache:  fineweb_edu_tokens_10b.bin
results_dir: results/stage3_1b
device:      cuda
tag: ""
